<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study 2 Intervention Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout follows the Study 2 Figma file: nav · conversation · character panel, plus a separate researcher console.
   Single light look on purpose, matching the low-fidelity Figma frames. Teal marks intervention elements. */
:root{
  color-scheme:light;
  --bg:#F2F2F3; --nav:#F7F7F8; --surface:#FFFFFF; --fill:#E9E9EC; --bubble:#E5E5E9;
  --line:#E4E4E7; --line-2:#D4D4D8;
  --ink:#18181B; --ink-2:#52525B; --ink-3:#8E8E96; --ink-4:#B4B4BB;
  --teal:#13786F; --teal-ink:#0F6A62; --teal-soft:#E3F1EE; --teal-line:#9FCFC7;
  --ok:#16A34A; --mark:#E11D48;
  --c-aria:#7A6AA2; --c-rho:#4D6472; --c-mina:#B47A58; --c-kai:#5E8A5C; --c-me:#9CA3AF;
  --c-m:#C08497; --c-k:#8A9CC7; --c-s:#D3A272;
  --shadow:0 10px 30px rgba(24,24,27,.12);
  --f:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;overflow:hidden}
:lang(ko) body{word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
#root{height:100%}

/* ---------- participant shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 304px;height:100%}
.app.no-side{grid-template-columns:256px minmax(0,1fr)}
.nav{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:20px 16px 16px;min-height:0;overflow-y:auto}
.wm{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 12px}
.wm b{font-size:20px;font-weight:600;letter-spacing:-.01em;cursor:default;user-select:none}
.wm span{color:var(--ink-4);font-size:12px}
.create{align-self:flex-start;display:inline-flex;gap:10px;align-items:center;background:var(--fill);border-radius:999px;padding:10px 22px;font-weight:500;margin-bottom:10px}
.nitem{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;width:100%;text-align:left;color:var(--ink)}
.nitem:hover{background:var(--fill)}
.nitem[aria-current="page"]{background:var(--fill)}
.sq{width:18px;height:18px;border-radius:4px;background:var(--ink-4);flex:none}
.nitem[aria-current="page"] .sq{background:var(--ink)}
.search{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:8px;padding:8px 12px;color:var(--ink-3);margin:12px 0 8px}
.search i{width:12px;height:12px;border:1.5px solid var(--ink-3);border-radius:50%}
.grp{font-size:12.5px;color:var(--ink-2);padding:10px 4px 2px}
.citem{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:10px;width:100%;text-align:left}
.citem:hover{background:var(--fill)}
.citem[aria-current="page"]{background:var(--fill)}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:16px 8px 0}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;color:#fff;font-weight:500;width:32px;height:32px;font-size:13px}
.av.xs{width:24px;height:24px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:24px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tbtn{border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font-size:13px;background:var(--surface)}
.view{flex:1;min-height:0;overflow-y:auto}
.side{background:var(--surface);border-left:1px solid var(--line);min-height:0;overflow-y:auto}

/* time bar (optional, researcher can show it) */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:10px 16px 0;padding:6px 12px;border:1px dashed var(--line-2);border-radius:10px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.simbar .clk{font-family:var(--mono);font-size:12px;color:var(--ink)}
.simbar .meter{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.simbar .bar{width:80px;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.simbar .bar i{display:block;height:100%;background:var(--ink-2)}

/* generic */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:500;font-size:13.5px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill:hover{background:var(--nav)}
.pill.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.dark:hover{opacity:.9}
.pill.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.teal:hover{opacity:.92}
.pill.grey{background:var(--fill);border-color:var(--fill)}
.pill.sm{padding:5px 12px;font-size:12.5px}
.pill[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:7px 16px;font-size:13.5px;border:1px solid var(--line-2);background:var(--surface)}
.chip.on,.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.chip.soft{background:var(--teal-soft);border-color:var(--teal-soft);color:var(--teal-ink);font-weight:500}
.tag{display:inline-flex;align-items:center;font-size:10.5px;border-radius:5px;padding:1px 6px;background:var(--fill);color:var(--ink-3);font-weight:500}
.tag.v{background:var(--teal-soft);color:var(--teal-ink)}
.card{background:var(--surface);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:15.5px;font-weight:600}
.muted{color:var(--ink-3);font-size:12.5px}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.page{max-width:1100px;margin:0 auto;padding-block:32px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.ph{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.show-specs [data-spec]{position:relative;outline:2px dashed var(--mark);outline-offset:3px}
.show-specs [data-spec]::after{content:attr(data-spec);position:absolute;top:-11px;left:-11px;background:var(--mark);color:#fff;font:600 10px/1 var(--mono);padding:4px 5px;border-radius:999px;z-index:5;pointer-events:none}

/* discover */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.dcard{background:var(--surface);border-radius:12px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.dcard:hover{box-shadow:var(--shadow)}
.dcard .img{height:132px;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:42px;font-weight:600}
.dcard .tx{padding:12px 14px 16px;display:flex;flex-direction:column;gap:2px}
.dcard b{font-weight:600}
.dcard span{color:var(--ink-3);font-size:12.5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(24,24,27,.42);display:grid;place-items:center;z-index:30;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);width:min(720px,100%);max-height:100%;overflow-y:auto;padding:40px;display:flex;flex-direction:column;gap:20px}
.modal h2{margin:0;font-size:22px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:14px;font-weight:600}
.box ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.box.val{background:var(--nav)}
.box.watch{background:var(--teal-soft)}
.box.watch h3{color:var(--teal-ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.lnk{color:var(--ink-2);font-size:13.5px}

/* chat */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:24px 16px 24px}
.col{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.vnote{max-width:680px;width:calc(100% - 32px);margin:20px auto 0;border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:14px;padding:16px 20px;display:flex;gap:16px;align-items:center}
.vnote .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vnote b{color:var(--teal-ink);font-weight:600;font-size:14px}
.vnote p{margin:0;color:var(--teal-ink);font-size:12.5px;line-height:1.55}
.vnote .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.chero{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 0 12px}
.chero .nm{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;margin-top:8px}
.chero .tg{color:var(--ink-2);font-size:13px}
.chero .by{color:var(--ink-4);font-size:11px}
.msg{display:flex;flex-direction:column;gap:8px}
.msg .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.bub{background:var(--bubble);border-radius:14px;padding:14px 16px;margin-left:24px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.6;max-width:576px}
.bub .nr{font-style:italic;color:var(--ink-2)}
:lang(ko) .bub .nr{font-style:normal;color:var(--ink-2)}
.bub p{margin:0}
.macts{display:flex;gap:8px;margin-left:28px}
.macts button{width:22px;height:22px;border:1px solid var(--ink-4);border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.macts button:hover{border-color:var(--ink-2);color:var(--ink-2)}
.umsg{align-self:flex-end;background:var(--bubble);border-radius:14px;padding:10px 16px;max-width:460px;font-size:14px}
.typing{margin-left:24px;align-self:flex-start;background:var(--bubble);border-radius:14px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.div{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line-2)}
.cut{margin-left:24px;border:1.5px solid var(--teal);background:var(--surface);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.cut b{color:var(--teal-ink);font-weight:600}
.cut p{margin:0;font-size:13.5px}
.inbar{padding:12px 16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inbar form{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px}
.inbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:6px 0;font-size:14px}
.inbar input::placeholder{color:var(--ink-3)}
.send{width:32px;height:32px;border-radius:50%;background:var(--ink-4);color:#fff;display:grid;place-items:center;flex:none}
.send.ready{background:var(--ink)}
.inbar.paused form{background:var(--fill);border-color:var(--fill)}
.inbar.paused .send{background:var(--line-2)}

/* character panel */
.cp{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.cp .top{display:flex;gap:14px;align-items:center}
.cp .top .t{display:flex;flex-direction:column;line-height:1.35}
.cp .top b{font-size:16px;font-weight:500}
.cp .top .t span{font-size:12px;color:var(--ink-2)}
.cp .row1{display:flex;gap:8px;align-items:center}
.circ{width:38px;height:38px;border:1px solid var(--line);border-radius:50%}
.cp .tags{font-size:12.5px;color:var(--ink-2);padding-bottom:14px;border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:10px;width:100%;text-align:left}
.mrow:hover{background:var(--nav)}
.mrow .sq{width:16px;height:16px}
.mrow .l{flex:1}
.mrow .r{color:var(--ink-2);font-size:13px}
.mrow .ch{color:var(--ink-3);font-size:12px}
.mrow.iv{background:var(--teal-soft);color:var(--teal-ink)}
.mrow.iv .sq{background:var(--teal)}
.mrow.iv .r,.mrow.iv .ch{color:var(--teal-ink)}
.vh{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:13px}
.vh b{font-weight:600}
.vh .r{display:grid;grid-template-columns:54px 1fr auto;font-variant-numeric:tabular-nums}
.vh .r span:nth-child(2){color:var(--ink-3)}
.vh .cur{color:var(--teal-ink)}
.vh .old{color:var(--ink-3)}

/* support panel */
.sup{padding:28px 22px;display:flex;flex-direction:column;gap:16px;border-top:3px solid var(--teal);min-height:100%}
.sup h2{margin:0;font-size:18px;font-weight:500;line-height:1.35;text-wrap:balance}
.sup p{margin:0;color:var(--ink-2);font-size:13px}
.res{background:var(--teal-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.res b{color:var(--teal-ink);font-weight:600;font-size:14px}
.res span{color:var(--teal-ink);font-size:12.5px;user-select:all}
.res .pill{margin-top:8px}
.sup hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.sup .close{align-self:flex-start;font-weight:500;font-size:13.5px}

/* my use */
.prompt{border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:14px;padding:18px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prompt .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.prompt b{color:var(--teal-ink);font-weight:600;font-size:15px}
.prompt p{margin:0;color:var(--teal-ink);font-size:13px}
.prompt .x{color:var(--teal-ink);width:28px;height:28px;display:grid;place-items:center;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat{background:var(--surface);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat .v{font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .d{font-size:12px;color:var(--ink-3)}
.mu2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px}
.gr{display:grid;grid-template-columns:24px 110px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:8px 0;font-size:13.5px}
.gr .track{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.gr .track i{display:block;height:100%;background:var(--ink-4);border-radius:5px}
.gr.up .track i{background:var(--teal)}
.gr .val{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.gr.up .val{color:var(--teal-ink)}
.side2 hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.big{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}

/* plan */
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:20px}
.field{border:1.5px solid var(--teal);border-radius:10px;padding:11px 14px;background:var(--surface)}
.field input{border:0;outline:none;width:100%;background:transparent}
.tp{display:grid;grid-template-columns:90px minmax(0,1fr) 80px;gap:14px;align-items:center;padding:8px 0;font-size:13.5px}
.tp .track{height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.tp .track i{display:block;height:100%;background:var(--line-2);border-radius:6px}
.tp.now{color:var(--teal-ink);font-weight:600}
.tp.now .track i{background:var(--teal)}
.tp .m{font-size:12.5px;color:var(--ink-2);font-weight:400}
.tp.now .m{color:var(--teal-ink)}
.pfoot{display:flex;justify-content:flex-end;gap:12px;align-items:center}
.planon{border:1.5px solid var(--teal);background:var(--teal-soft);color:var(--teal-ink);border-radius:12px;padding:12px 18px;font-weight:500}

/* community */
.room{display:flex;flex-direction:column;height:100%;min-height:0}
.rhead{display:flex;align-items:center;gap:12px;padding:16px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.rhead .t{display:flex;flex-direction:column;line-height:1.35}
.rhead b{font-weight:500;font-size:15px}
.rhead .t span{font-size:12px;color:var(--ink-2)}
.cm{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px}
.cm:hover,.cm.open{background:var(--surface)}
.cm .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cm .who{display:flex;align-items:center;gap:10px;font-size:13.5px}
.cm .tx{font-size:14px}
.peer{font-size:10.5px;font-weight:600;color:var(--teal-ink);background:var(--teal-soft);border-radius:5px;padding:1px 6px}
.flagbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;opacity:0;color:var(--ink-2)}
.flagbtn span{width:14px;height:14px;border:1.5px solid currentColor;border-radius:2px}
.cm:hover .flagbtn,.cm.open .flagbtn,.flagbtn:focus-visible{opacity:1}
@media (hover:none){.flagbtn{opacity:1}}
.pop{position:absolute;right:28px;top:44px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);z-index:10;width:210px;padding:6px}
.pop button{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:8px;width:100%;text-align:left}
.pop button:hover{background:var(--teal-soft)}
.pop b{color:var(--teal-ink);font-weight:600;font-size:13px}
.pop span{color:var(--ink-3);font-size:11.5px}
.flagged{font-size:12px;color:var(--teal-ink)}
.guide{margin-left:44px;border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:14px;padding:16px 20px;display:flex;gap:12px;align-items:flex-start;max-width:600px}
.guide .b{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.guide .who{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--teal-ink)}
.guide .tag{background:var(--surface);color:var(--teal-ink)}
.guide .pill{align-self:flex-start}
.rp{padding:24px 22px;display:flex;flex-direction:column;gap:8px}
.rp h2{margin:0;font-size:16px;font-weight:500}
.rp .d{font-size:12.5px;color:var(--ink-2);padding-bottom:12px;border-bottom:1px solid var(--line)}

/* personas */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.pcard{--pcs:color-mix(in srgb, var(--pc) 13%, #fff);background:var(--surface);border-radius:16px;padding:0 24px 24px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:hidden;border-top:6px solid var(--pc)}
.pband{margin:0 -24px;padding:20px 24px 18px;background:var(--pcs)}
.pcard .facts{background:var(--pcs)}
.pcard .quotes li{border-left-color:var(--pc)}

function go(route){

  UI.sideOpen = !!(S.support && S.s.S4 && route==='chat');
  log('screen_view', route==='chat' ? 'chat/'+S.char : route.replace('myuse','my_use'));
  if(route==='community') startCommunity();
  save(); render();
}

/* =========================================================
   Render
   ========================================================= */
function render(){
  document.documentElement.lang = S.view==='admin' ? 'en' : (S.lang==='en'?'en':'ko');
  const ae = document.activeElement, aid = ae && ae.id, sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const root = document.getElementById('root');
  const keep = {}; ['.admin','.view','.side','.nav','.scroll'].forEach(q=>{ const el = root.querySelector(q); if(el) keep[q] = {top:el.scrollTop, atBottom: el.scrollHeight - el.scrollTop - el.clientHeight < 80}; });
  const prevView = UI.lastView; UI.lastView = S.view + '|' + S.part + '|' + S.route + '|' + S.char;
  root.className = S.showSpecs && S.view!=='admin' ? 'show-specs' : '';
  if(S.view==='admin') root.innerHTML = renderAdmin();
  else if(S.part==='A' || S.route==='personas') root.innerHTML = renderPersonas();
  else root.innerHTML = renderApp();
  document.getElementById('overlay').innerHTML = (S.view!=='admin' && !SYNC.on ? `<button class="adminbtn" data-act="toAdmin">Admin</button>` : '') + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : '');
  if(aid){ const el = document.getElementById(aid); if(el){ el.focus(); if(sel && el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
  const same = prevView === UI.lastView;
  Object.keys(keep).forEach(q=>{ const el = root.querySelector(q); if(!el) return;
    if(q==='.scroll') el.scrollTop = (!same || keep[q].atBottom) ? el.scrollHeight : keep[q].top;
    else if(same) el.scrollTop = keep[q].top; });
  if(!keep['.scroll']) root.querySelectorAll('.scroll').forEach(m => m.scrollTop = m.scrollHeight);
}

function renderApp(){
  const side = sideContent();
  const showS1 = S.s.S1 && !S.onboardDone;
  return `<div class="app ${side?'':'no-side'}">
    ${renderNav()}
    <main class="main">
      <div class="topbar"><button class="tbtn navonly" data-act="nav">${t('menu')}</button><b>Prototype</b>${side?`<button class="tbtn sideonly" data-act="side">${t('info')}</button>`:'<span></span>'}</div>
      ${S.showTime ? renderSimBar() : ''}
      <div class="view">${showS1 ? renderDiscover() : renderView()}</div>
    </main>
    ${side && !showS1 ? `<aside class="side ${UI.sideOpen?'open':''}">${side}</aside>` : ''}
  </div>${showS1 ? renderS1() : ''}`;
}
function renderNav(){
  const ni = (r,label) => `<button class="nitem" data-act="go" data-r="${r}" ${S.route===r?'aria-current="page"':''}><span class="sq"></span>${label}</button>`;
  const ci = c => `<button class="citem" data-act="chat" data-c="${c}" ${S.route==='chat'&&S.char===c?'aria-current="page"':''}>${av(c)}<span>${esc(cname(c))}</span></button>`;
  const order = navChars();
  return `<nav class="nav ${UI.navOpen?'open':''}">
    <div class="wm"><b data-act="wm">Prototype</b><span>‹‹</span></div>
    <button class="create" data-act="inert">+ &nbsp;${t('create')}</button>
    ${ni('discover',t('discover'))}<button class="nitem" data-act="inert"><span class="sq"></span>${t('feed')}</button>${ni('community',t('community'))}${ni('myuse',t('myuse'))}
    <div class="search"><i></i>${t('search')}</div>
    <div class="grp">${t('today')}</div>${order.today.map(ci).join('')}
    <div class="grp">${t('earlier')}</div>${order.earlier.map(ci).join('')}
    <div class="me">${avX('P','--c-me')}<span>${pname()}</span></div>
  </nav>`;
}
function navChars(){
  const top = persona().dash.grow[0][0];
  const today = top==='aria' ? ['aria', persona().dash.grow[1]?.[0] || 'rho'] : ['aria', top];
  if(S.persona==='P6') return {today:['aria','rho'], earlier:['mina','kai']};
  const t2 = [...new Set(today)];
  return {today:t2, earlier:['aria','rho','mina','kai'].filter(c=>!t2.includes(c))};
}
function renderSimBar(){
  const on = limitOn(), lim = on ? limitMin() : null;
  return `<div class="simbar"><span class="clk">${fmtClock()}</span><span class="meter">${t('timeToday')} <b>${S.sim.used}</b>${on?` / ${lim}`:''} ${S.lang==='en'?'min':'분'} <span class="bar"><i style="width:${Math.min(100, on? S.sim.used/lim*100 : S.sim.used/180*100)}%"></i></span></span></div>`;
}
function renderView(){
  switch(S.route){ case 'myuse': return renderMyUse(); case 'plan': return renderPlan(); case 'community': return renderCommunity(); case 'discover': return renderDiscover(); default: return renderChat(); }
}
function sideContent(){
  if(S.route==='chat') return (S.support && S.s.S4) ? renderSupport() : renderCharPanel();
  if(S.route==='community') return renderRoomPanel();
  return '';
}

/* ---------- Chat ---------- */
function bubble(text){
  const [n, d] = parts(text);
  return `<div class="bub">${n?`<p class="nr">${esc(n)}</p>`:''}<p>${esc(d)}</p></div>`;
}
function renderChat(){
  const c = S.char, isAria = c==='aria', s6 = S.s.S6 && isAria, v = curVer();
  const msgs = S.chats[c];
  let lastAi = -1; msgs.forEach((m,i)=>{ if(m.f==='ai') lastAi = i; });
  let body = `<div class="chero">${av(c,'lg')}<span class="nm">${esc(cname(c))}${s6?`<span class="tag v" data-spec="S6">${v}</span>`:''}</span><span class="tg">${esc(tx(CHARS[c].tags))}</span><span class="by">@studio_demo</span></div>`;
  msgs.forEach((m,i) => {
    if(m.f==='sys'){ body += `<div class="div">${t(m.id)}</div>`; return; }
    if(m.f==='user'){ body += `<div class="umsg">${esc(m.text)}</div>`; return; }
    body += `<div class="msg"><div class="hd">${av(c,'xs')}${esc(cname(c))}${s6&&m.v?`<span class="tag v" data-spec="S6">AI · ${m.v}</span>`:'<span class="tag">AI</span>'}</div>${bubble(line(m.id))}
      ${i===lastAi && !UI.typing ? `<div class="macts"><button data-act="inert" aria-label="Copy"></button><button data-act="inert" aria-label="Rate"></button><button data-act="inert" aria-label="Regenerate"></button></div>` : ''}</div>`;
  });
  if(UI.typing) body += `<div class="msg"><div class="hd">${av(c,'xs')}${esc(cname(c))}<span class="tag">AI</span></div><div class="typing" aria-label="typing"><i></i><i></i><i></i></div></div>`;
  if(S.cutoff){
    const n = S.lang==='en' ? cname(c) : josa(cname(c),'과의','와의');
    body += `<div class="cut" ${S.s.S4?'data-spec="S4"':''}><b>${t('cutTitle')}</b><p>${t('cutBody',{n})}</p>${S.plan.saved?`<span class="muted">${t('cutWeek',{w:Math.min(S.plan.week,4),m:limitMin()})}</span>`:''}</div>`;
  }
  let note = '';
  if(s6){
    const retire = S.model.rollout!==null ? fmtLong(S.model.rollout+30) : '';
    if(S.model.notice!==null && !rolledOut() && !S.model.noticeSeen){
      note = `<div class="vnote" data-spec="S6"><div class="t"><b>${t('s6Pre',{d:fmtLong(S.model.rollout),n:cname('aria')})}</b><p>${t('s6PreBody')}</p></div><div class="acts"><button class="pill teal sm" data-act="noticeOk">${t('gotIt')}</button></div></div>`;
    } else if(rolledOut() && S.model.pinned){
      note = `<div class="vnote" data-spec="S6"><div class="t"><b>${t('onV23',{d:retire})}</b></div><div class="acts"><button class="pill sm" data-act="toV24">${t('toV24')}</button></div></div>`;
    } else if(rolledOut() && !S.model.rolloutSeen){
      const n = S.lang==='en' ? cname('aria') : cname('aria');
      note = `<div class="vnote" data-spec="S6"><div class="t"><b>${t('s6Now',{n,d:fmtLong(S.model.rollout)})}</b><p>${t('s6NowBody')} ${S.model.notice!==null?t('s6Notified',{d:fmtLong(S.model.notice)}):''} ${t('s6Kept',{d:retire})}</p></div><div class="acts"><button class="pill teal sm" data-act="toV23">${t('toV23')}</button><button class="pill sm" data-act="details">${t('details')}</button></div></div>`;
    }
  }
  const paused = S.cutoff, ready = !!(S.drafts.chat||'').trim();
  return `<div class="chat">${note}
    <div class="scroll" aria-live="polite"><div class="col">${body}</div></div>
    <div class="inbar ${paused?'paused':''}"><form data-form="chat"><input id="chat-input" autocomplete="off" ${paused?'disabled':''} placeholder="${paused?t('paused'):t('msgTo',{n:cname(c)})}" value="${esc(S.drafts.chat||'')}" aria-label="${t('msgTo',{n:cname(c)})}"><button class="send ${ready&&!paused?'ready':''}" type="submit" ${paused?'disabled':''} aria-label="Send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form></div>
  </div>`;
}

  let vh = '';

    const v23 = `<div class="r ${v==='v2.3'?'cur':''}"><span>v2.3</span><span>${S.lang==='en'?'Sep 2':'9월 2일'}</span><span>${out ? (v==='v2.3'? t('current')+' · ':'') + t('until',{d:fmtShort(r+30)}) : t('current')}</span></div>`;
    vh = `<div class="vh" id="verhist" data-spec="S6"><b>${t('verHist')}</b>${v24}${v23}<div class="r old"><span>v2.2</span><span>${S.lang==='en'?'Jun 11':'6월 11일'}</span><span>${t('retired')}</span></div></div>`;

    <div class="row1"><span class="circ"></span><button class="pill sm" data-act="inert">${t('like')} &nbsp;${ch.likes}</button><span style="flex:1"></span><span class="circ"></span><span class="circ"></span></div>
    <div class="tags">${esc(tx(ch.tags))}</div>
    <button class="pill grey" style="align-self:flex-start" data-act="inert">${t('newChat')}</button>
    <div>${row(t('voice'),t('dflt'))}${row(t('history'))}${row(t('customize'))}${row(t('pinned'))}${row(t('persona'))}${row(t('style'),t('standard'))}${s6?row(t('modelVer'),v,'iv','details','S6'):''}</div>
    ${vh}
  </div>`;
}

/* ---------- My use (S2) ---------- */
function renderMyUse(){
  const p = persona(), d = p.dash;
  const st4d = limitOn() ? t('st4p',{m:limitMin()}) : t('st4d');
  if(!S.s.S2){
    return `<div class="page"><div><h1 class="ph">${t('myuse')}</h1><p class="sub" style="margin-top:4px">${t('myuseSub')}</p></div>
      <div class="stats" style="grid-template-columns:repeat(2,minmax(0,260px))"><div class="stat"><span class="k">${t('st4')}</span><span class="v">${d.sessions}</span><span class="d">${st4d}</span></div><div class="stat"><span class="k">${t('timeToday')}</span><span class="v">${t('minutes',{m:S.sim.used})}</span></div></div></div>`;
  }
  const extra = S.chats.aria.filter(m=>m.f==='user').length * 2;
  const grow = d.grow.map(g => ({c:g[0], v:g[1] + (g[0]==='aria'?extra:0), d:tx(g[2]), up:!!g[3]}));
  const max = Math.max(...grow.map(g=>g.v));
  const rows = grow.map(g=>`<div class="gr ${g.up?'up':''}">${av(g.c,'xs')}<span>${esc(cname(g.c))}</span><span class="track"><i style="width:${Math.max(3,g.v/max*100)}%"></i></span><span class="val">${g.v.toLocaleString()} · ${esc(g.d)}</span></div>`).join('');
  const top = grow[0].c;
  const showPrompt = !S.s2Dismissed && p.zones.includes('AF');
  if(showPrompt && !S.fired.s2){ S.fired.s2 = true; log('intervention_queued','S2 · reflective prompt'); }
  const motives = motiveList().map(m=>`<span class="chip soft">${t('m_'+m)}</span>`).join(' ');
  const n = S.lang==='en' ? cname(top) : josa(cname(top),'과의','와의');
  return `<div class="page">
    <div><h1 class="ph">${t('myuse')}</h1><p class="sub" style="margin-top:4px">${t('myuseSub')}</p></div>
    ${showPrompt?`<div class="prompt" data-spec="S2"><div class="t"><b>${t('s2P',{n})}</b><p>${t('s2PSub')}</p></div><button class="pill" data-act="s2ok">${t('looksRight')}</button>${S.s.S3?`<button class="pill teal" data-act="s2plan">${t('planWeek')}</button>`:''}<button class="x" data-act="s2x" aria-label="${t('close')}">✕</button></div>`:''}
    <div class="stats" data-spec="S2">
      <div class="stat"><span class="k">${t('st1')}</span><span class="v">${d.chars[0]}</span><span class="d">${tx(d.chars[1])}</span></div>
      <div class="stat"><span class="k">${t('st2')}</span><span class="v">${d.personas[0]}</span><span class="d">${tx(d.personas[1])}</span></div>
      <div class="stat"><span class="k">${t('st3')}</span><span class="v">${d.comfort}</span><span class="d">${t('st3d')}</span></div>
      <div class="stat"><span class="k">${t('st4')}</span><span class="v">${d.sessions}</span><span class="d">${st4d}</span></div>
    </div>
    <div class="mu2">
      <section class="card"><div><h2>${t('growT')}</h2><span class="muted">${t('growS')}</span></div><div>${rows}</div></section>
      <section class="card side2"><span class="sub">${t('whyStart')}</span><div class="opts">${motives}</div><span class="muted">${t('whyStartS')}</span><hr><span class="sub">${t('auto')}</span><span class="big">${t('autoV',{a:d.auto[0],b:d.auto[1]})}</span><span class="muted">${t('autoS')}</span>
        ${S.s.S3 && !showPrompt ? `<button class="pill sm" style="align-self:flex-start;margin-top:8px" data-act="go" data-r="plan">${t('planWeek')}</button>`:''}</section>
    </div>
  </div>`;

/* ---------- Community (S5) ---------- */
function renderCommunity(){
  const s5 = S.s.S5;
  const one = (id, user, col, text, o) => {
    o = o||{}; const fl = S.comm.flags[id], open = UI.menuFor===id;
    return `<div class="cm ${open?'open':''}">${avX(user[0].toUpperCase(), col)}<div class="b"><div class="who"><span>${esc(user)}</span>${o.peer&&s5?`<button class="peer" data-act="peerTip" title="${t('peerTip')}" data-spec="S5">${t('peer')}</button>`:''}</div><div class="tx">${esc(text)}</div>${fl?`<span class="flagged">${t('flagged')}</span>`:''}</div>
      ${s5 && !o.mine && !fl ? `<button class="flagbtn" data-act="menu" data-id="${id}" aria-label="${t('flag')}" aria-expanded="${open}"><span></span></button>`:''}
      ${open?`<div class="pop" data-spec="S5"><button data-act="flag" data-id="${id}"><b>${t('flag')}</b><span>${t('flagS')}</span></button></div>`:''}</div>`;
  };
  const guide = () => s5 ? `<div class="guide" data-spec="S5">${avX('G','--teal','xs')}<div class="b"><div class="who">${t('guide')} <span class="tag">${t('system')}</span></div><span>${t('guideTxt')}</span><button class="pill teal sm" data-act="guideMyUse">${t('openMyUse')}</button></div></div>` : '';
  let out = '';
  COMM.slice(0, S.comm.shown).forEach(c => { out += one(c.id, c.user, c.col, line(c.id), {peer:c.peer}); });
  if(S.comm.shown >= COMM.length) out += guide();
  S.comm.posts.forEach((p,i) => {
    if(p.mine) out += one('p'+i, pname(), '--c-me', p.text, {mine:true});
    else if(p.guide) out += guide();
    else out += one('p'+i, p.user, p.col, line(p.id), {peer:p.peer});
  });
  if(UI.ctyping) out += `<div class="typing" style="margin-left:60px"><i></i><i></i><i></i></div>`;
  const ready = !!(S.drafts.room||'').trim();
  return `<div class="room">

function elapsed(){ const s = Math.floor((Date.now()-S.started)/1000); return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':'); }

   Behaviour
   ========================================================= */
function ensureGreeting(){
  if(rolledOut() && !S.model.greeted){
    S.model.greeted = true;
    if(S.s.S6) S.chats.aria.push({f:'sys', id:'divUpdated'});
    S.chats.aria.push({f:'ai', id:'a4_greet', v:'v2.4'});
  }
}
function startCutoff(reason){
  S.cutoff = true;
  if(S.s.S4){ S.support = 'cutoff'; UI.sideOpen = S.route==='chat'; log('intervention_queued','S4 · support panel (cutoff)'); }
}
function checkCutoff(){ if(limitOn() && S.sim.used >= limitMin() && !S.cutoff){ log('access_block', `plan week ${S.plan.week} · ${limitMin()} min`); startCutoff(); } }
function newDay(days){
  S.sim.day += days + Math.floor(S.sim.min/1440); S.sim.min = 22*60+30; S.sim.used = 0;
  if(days>=7 && S.plan.saved) S.plan.week = Math.min(4, S.plan.week+1);
  const was = S.cutoff; S.cutoff = false; if(S.support==='cutoff') S.support = null;
  S.fired.block = null;
  if(rolledOut()) ensureGreeting();
  log('sim_time', days>=7 ? 'next week' : 'next day');
  save(); render(); if(was && S.view!=='admin') toast(t('resumed'));
}
function sendChat(text){
  const c = S.char; S.drafts.chat = '';
  S.chats[c].push({f:'user', text});
  S.sim.min += CONFIG.minutesPerMessage; S.sim.used += CONFIG.minutesPerMessage;
  log('message_sent', `${c} · ${text.length} chars`);
  if(has(text, CONFIG.rupture) && S.s.S4 && !S.support){ S.support = 'rupture'; UI.sideOpen = true; log('intervention_queued','S4 · support panel (rupture signal)'); }
  UI.typing = true; save(); render();
  setTimeout(()=>{
    UI.typing = false; let id;
    if(c==='aria'){
      const v = curVer(), key = v==='v2.4'?'aria24':'aria23';
      if(has(text, CONFIG.sleep)) id = v==='v2.4'?'a4_sleep':'a3_sleep';
      else { const arr = SCRIPT[key]; id = arr[S.idx[key] % arr.length]; S.idx[key]++; }
      S.chats.aria.push({f:'ai', id, v});
    } else { const arr = SCRIPT[c]; id = arr[S.idx[c] % arr.length]; S.idx[c]++; S.chats[c].push({f:'ai', id}); }
    log('message_received', `${c} · ${parts(line(id))[0] ? 2 : 1} parts`);
    checkCutoff(); save(); render();
  }, 1200 + Math.random()*800);
}
function sendRoom(text){
  S.drafts.room = '';
  S.comm.posts.push({mine:true, text});
  const disp = has(text, CONFIG.displacement);
  log('message_sent', `community · ${text.length} chars${disp?' · displacement':''}`);
  UI.ctyping = true; save(); render();
  setTimeout(()=>{
    UI.ctyping = false;
    if(disp && S.s.S5){ S.comm.posts.push({id:'peerReply', user:'soft_static', col:'--c-s', peer:true}); S.comm.posts.push({guide:true}); log('intervention_queued','S5 · guide prompt (self-disclosure)'); }
    else if(disp) S.comm.posts.push({id:'echoReply', user:'moonlit_reader', col:'--c-m'});
    else S.comm.posts.push({id:'genReply', user:'kei_02', col:'--c-k'});
    save(); render();
  }, 1500);
}
function applyPreset(v){
  S.preset = v;
  if(v==='baseline') S.s = {...ALLOFF};
  else if(v==='all') S.s = {S1:true,S2:true,S3:true,S4:true,S5:true,S6:true};
  else if(v==='persona'){ S.s = {...ALLOFF}; persona().preset.forEach(k => S.s[k] = true); }
  if(!S.s.S4) S.support = null;
  log('condition_preset', `${v} · ${condSummary()}`);
}
function csv(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  return ['time,event,detail,participant,persona,lang,sim_time', ...S.log.map(r=>[new Date(r.ts).toISOString(),r.event,r.detail,r.pid,r.persona,r.lang,r.sim].map(q).join(','))].join('\n');

  specs(){ S.showSpecs = !S.showSpecs; save(); render(); },
  simToggle(){ S.showTime = !S.showTime; save(); render(); },
  t15(){ S.sim.min += 15; S.sim.used += 15; log('sim_time','+15 min'); checkCutoff(); save(); render(); },
  tday(){ newDay(1); },
  tweek(){ newDay(7); },
  fireBlock(){
    S.fired.block = Date.now(); log('scripted_event','access_block');
    if(S.plan.saved) S.sim.used = Math.max(S.sim.used, limitMin());
    startCutoff(); S.char = S.char || 'aria'; S.route = 'chat'; save(); render();
  },
  fireNotice(){
    S.fired.notice = Date.now(); S.model.notice = S.sim.day; S.model.rollout = S.sim.day + 7; S.model.noticeSeen = false; S.model.greeted = false;
    log('scripted_event', `advance_notice · change on ${fmtShort(S.model.rollout)}`);
    if(S.s.S6) log('intervention_queued','S6 · advance notice');
    S.char = 'aria'; S.route = 'chat'; save(); render();
  },
  fireModel(){
    S.fired.model = Date.now();
    const r = S.model.notice!==null ? S.model.notice + 7 : Math.max(S.sim.day, 7);
    S.model.rollout = r; if(S.model.notice===null) S.model.notice = r - 7;
    if(S.sim.day < r){ S.sim.day = r; S.sim.min = 22*60+30; S.sim.used = 0; S.cutoff = false; if(S.support==='cutoff') S.support = null; }
    S.model.pinned = false; S.model.rolloutSeen = false; S.model.greeted = false;
    log('scripted_event','model_change · v2.3 → v2.4');
    if(S.s.S6) log('intervention_queued','S6 · version notice');
    S.char = 'aria'; ensureGreeting(); S.route = 'chat'; save(); render();
  },
  reset(){
    const keep = {pid:S.pid, part:S.part, persona:S.persona, lang:S.lang, preset:S.preset, s:S.s, record:S.record, showTime:S.showTime, showSpecs:S.showSpecs, log:S.log};
    S = freshSession(keep); S.view = 'admin';
    log('session_start', `${S.pid} · persona ${S.persona} · ${condSummary()}`); save(); render();
  },
  async exportCsv(){
    const text = csv(), name = `study2_${S.pid}_${new Date().toISOString().slice(0,10)}.csv`;
    log('log_export', `${S.log.length} events`);
    const d = await dlP;
    if(d){ try{ await d.save({filename:name, data:text}); toast('CSV saved.'); return; }catch(e){ if(e && e.code==='declined') return; } }
    if(navigator.clipboard && navigator.clipboard.writeText){ try{ await navigator.clipboard.writeText(text); toast('CSV copied to the clipboard.'); return; }catch(e){} }
    showLog(text);
  },
  askClear(){ UI.confirmClear = true; render(); },
  cancelClear(){ UI.confirmClear = false; render(); },
  clearLog(){ S.log = []; UI.confirmClear = false; UI.logText = null; save(); render(); },
  sel(el){ applySel(el.dataset.k, el.dataset.v); save(); render(); },
  async copyLink(){
    const link = participantLink();
    try{ await navigator.clipboard.writeText(link); toast('Participant link copied.'); }catch(e){ toast(link); }
  }
};
function applySel(k, v){
  if(k==='pid'){ S.pid = v; log('session_start', `${S.pid} · persona ${S.persona} · ${condSummary()}`); }
  if(k==='part'){ S.part = v; log('session_part', v==='A'?'persona review':'intervention use'); }
  if(k==='lang'){ S.lang = v; log('language', v); }
}

/* =========================================================
   Remote sync (only when CONFIG.syncUrl is set)
   Admin tab sends commands. Participant tab runs them with the same ACT handlers,
   then sends back a state summary and new log events. Chat text is never sent.
   ========================================================= */
const REMOTE_ACTS = new Set(['persona','preset','tog','record','specs','simToggle','t15','tday','tweek','fireBlock','fireNotice','fireModel','reset','clearLog','sel']);
async function post(body){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 12000); // a stuck request must not block later ticks
  try{
    const r = await fetch(SYNC.url, {method:'POST', body:JSON.stringify(body), signal:ctl.signal, cache:'no-store'}); // text/plain, so no CORS preflight
    return await r.json();
  }finally{ clearTimeout(timer); }
}
function snapshot(){
  return {pid:S.pid, part:S.part, persona:S.persona, lang:S.lang, preset:S.preset, s:S.s, record:S.record,
    showTime:S.showTime, showSpecs:S.showSpecs, started:S.started, sim:S.sim, plan:{saved:S.plan.saved, week:S.plan.week},
    fired:S.fired, model:S.model, cutoff:S.cutoff, support:S.support, route:S.route, char:S.char, onboardDone:S.onboardDone, ack:SY.seq};
}

/* participant side */
const SYKEY = KEY + ':sync';
const SY = (()=>{ try{ return JSON.parse(localStorage.getItem(SYKEY)) || {seq:-1, pushed:0}; }catch(e){ return {seq:-1, pushed:0}; } })();
function saveSY(){ try{ localStorage.setItem(SYKEY, JSON.stringify(SY)); }catch(e){} }
let pBusy = false, pLast = '';
function applyCmd(c){
  if(!REMOTE_ACTS.has(c.act) || !ACT[c.act]) return;
  ACT[c.act]({dataset: c.data || {}});
  if(c.act==='clearLog') SY.pushed = 0;
  S.view = 'participant'; UI.confirmClear = false;
  if(S.route==='community') startCommunity();
  save(); render();
}
async function pTick(){
  if(pBusy) return; pBusy = true;
  let again = false;
  try{
    if(SY.pushed > S.log.length) SY.pushed = 0;
    const n = S.log.length, logs = S.log.slice(SY.pushed), snap = JSON.stringify(snapshot());
    const body = {op:'p', room:SYNC.room, since:SY.seq};
    if(snap !== pLast) body.state = JSON.parse(snap);
    if(logs.length) body.logs = logs;
    const res = await post(body);
    if(res.error) throw new Error(res.error);
    SY.pushed = n; if(body.state) pLast = snap;
    if(SY.seq < 0) SY.seq = res.seq;                       // first contact: skip older commands
    else for(const c of res.cmds){ if(c.seq > SY.seq){ applyCmd(c); SY.seq = c.seq; again = true; } }
    saveSY();
  }catch(e){ /* keep working offline; retry on the next tick */ }
  finally{ pBusy = false; if(again) setTimeout(pTick, 0); }
}

/* admin side */
const AD = {key:'', queue:[], clear:false, inflight:false, lastSent:0, log:[], state:null, online:false, ok:null, err:'', sig:''};
try{ AD.key = localStorage.getItem('study2-admin-key') || ''; }catch(e){}
function remote(act, data){ AD.queue.push({act, data}); aTick(); }
function adopt(st){
  ['pid','part','persona','lang','preset','s','record','showTime','showSpecs','started','sim','fired','model','cutoff','support','route','char','onboardDone']
    .forEach(k => { if(st[k] !== undefined) S[k] = st[k]; });
  S.plan = {...S.plan, ...st.plan}; S.view = 'admin';
}
async function aTick(){
  if(AD.inflight || !AD.key) return; AD.inflight = true;
  const cmds = AD.queue.splice(0), clear = AD.clear; AD.clear = false;
  try{
    const res = await post({op:'a', room:SYNC.room, key:AD.key, cmds, clearLog:clear, logFrom:AD.log.length});
    if(res.error==='key'){ AD.key = ''; AD.err = 'The key did not match.'; try{ localStorage.removeItem('study2-admin-key'); }catch(e){} render(); return; }
    if(res.error) throw new Error(res.error);
    AD.ok = true; AD.err = '';
    if(cmds.length) AD.lastSent = res.seq;
    if(res.logFrom < AD.log.length) AD.log = AD.log.slice(0, res.logFrom);
    res.logs.forEach(r => AD.log.push({ts:Number(r[1]), event:r[3], detail:r[4], pid:r[5], persona:r[6], lang:r[7], sim:r[8]}));
    AD.online = !!res.seen && (res.now - res.seen) < 8000;
    AD.state = res.state;
    if(res.state && !AD.queue.length && res.state.ack >= AD.lastSent) adopt(res.state);
    S.log = AD.log;
  }catch(e){
    AD.ok = false; AD.queue.unshift(...cmds); if(clear) AD.clear = true;
  }finally{
    AD.inflight = false;
    const sig = JSON.stringify([AD.ok, AD.online, AD.state, AD.log.length, AD.err]);
    const busy = /SELECT|INPUT|TEXTAREA/.test(document.activeElement?.tagName||'');
    if(sig !== AD.sig && !busy){ AD.sig = sig; render(); }
    if(AD.queue.length) setTimeout(aTick, 0);
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el){ if(UI.menuFor){ UI.menuFor = null; render(); } return; }
  const act = el.dataset.act, fn = ACT[act];
  if(fn && RA && REMOTE_ACTS.has(act)){
    e.preventDefault();
    const data = {...el.dataset}; delete data.act;
    if(act==='clearLog'){ AD.clear = true; AD.log = []; }
    remote(act, data); fn(el); // send to the participant tab, and show the change here at once
    return;
  }
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('change', e => {
  const el = e.target; if(!el.dataset || !el.dataset.sel) return;
  const k = el.dataset.sel;
  if(RA) remote('sel', {k, v:el.value});
  applySel(k, el.value);
  save(); render();
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if(id==='chat-input' || id==='room-input'){
    S.drafts[id==='chat-input'?'chat':'room'] = e.target.value;
    const b = e.target.form && e.target.form.querySelector('.send'); if(b) b.classList.toggle('ready', !!e.target.value.trim());
  }
  if(id==='plan-activity') S.drafts.activity = e.target.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if(f==='key'){ const v = (document.getElementById('a-key')?.value||'').trim(); if(v){ AD.key = v; AD.err = ''; try{ localStorage.setItem('study2-admin-key', v); }catch(_){} render(); aTick(); } return; }
  if(f==='chat'){ const v = (S.drafts.chat||'').trim(); if(v && !S.cutoff && !UI.typing) sendChat(v); }
  if(f==='room'){ const v = (S.drafts.room||'').trim(); if(v && !UI.ctyping) sendRoom(v); }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if(e.key==='`' && !typing && !SYNC.on){ e.preventDefault(); S.view==='admin' ? ACT.toParticipant() : ACT.toAdmin(); }
  if(e.key==='Escape' && UI.menuFor){ UI.menuFor = null; render(); }
});

if(location.hash==='#admin' && !SYNC.on) S.view = 'admin';
if(RA) S.view = 'admin';
if(RP) S.view = 'participant';
if(!S.log.length) log('session_start', `${S.pid} · persona ${S.persona} · ${condSummary()}`);
if(S.route==='community' && S.view!=='admin') startCommunity();
render();
if(RP){ pTick(); setInterval(pTick, 2000); }
if(RA){ aTick(); setInterval(aTick, 2500); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible'){ if(RP) pTick(); if(RA) aTick(); } });
</script>

</body></html>
